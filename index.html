<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Huddle landing page with single introductory section">
    <meta name="author" content="laronel">
    <link rel="icon" type="image/png"  sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/mobile-first.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/89014b1fca.js" crossorigin="anonymous"></script>
    <title>Huddle landing page</title>
  </head>
  <body>
    <header class="header">
      <img class="huddle-logo" src="/images/logo.svg">
    </header>
    <main class="main-container">
      <section class="content">
        <div class="image-illustration">
          <img class="image-layout" src="/images/illustration-mockups.svg">
        </div>
        <div class="page-content">
            <h1>Build The Community  Your fans Will Love</h1>
              <p>
                Huddle re-imagines the way we build communities. You have a voice, but so does your audience. Create connections with your users as you engage in genuine discussion.
              </p>
          <button type="Submit" class="btn_register">
            Register
          </button>
      </div>
      </section>
    </main>
    <footer class="footer-icon">
      <div class="social-media">
        <div class="facebook-icon">
          <i class="icon fa-facebook-f" aria-label="facebook" role="facebook-Icon"></i>
        </div>
        <div class="twitter-icon">
          <i class="icon fa-twitter" aria-label="twitter" role="twitter-icon"></i>
        </div>
        <div class="instagram-icon">
          <i class="icon fa-instagram" aria-label="instagram" role="instagram-icon"></i>
        </div>
      </div>
    </footer>
  </body>
</html>
